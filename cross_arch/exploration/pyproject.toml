[project]
name = "cross-arch-controlled-explorer"
version = "0.1.0"
description = "Deterministic control plane for harmless cross-architecture interaction exploration"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
xarch = "xarch.cli:main"

[tool.setuptools]
packages = ["xarch"]

