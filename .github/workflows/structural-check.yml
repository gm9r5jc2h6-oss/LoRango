name: structural-check

on:
  push:
  pull_request:

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python scripts/verify_release.py
      - run: python scripts/verify_reference.py
      - run: python -m unittest tests/test_verify_run_negative.py -v
      - run: python -m compileall -q lorango_sdxl scripts tests
      - run: python -m pip install --upgrade build
      - run: python -m build --wheel
      - name: Verify wheel assets
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")
          assert len(wheel) == 1, wheel
          with zipfile.ZipFile(wheel[0]) as archive:
              names = set(archive.namelist())
          required = {
              "lorango_sdxl/assets/carrier_catalog.json",
              "lorango_sdxl/assets/scaffold_init.json",
              "lorango_sdxl/assets/scaffold_init.safetensors",
          }
          assert required.issubset(names), sorted(required - names)
          PY

  runtime-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - run: python scripts/self_test.py
      - run: python -m unittest discover -s tests -v
